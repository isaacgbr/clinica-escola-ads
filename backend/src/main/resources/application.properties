spring.application.name=clinica-escola-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/clinica-escola-spring_dev
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Não executar scripts de inicialização nem registrar parâmetros/erros SQL com dados pessoais.
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
server.forward-headers-strategy=none
