
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | UNINASSAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <img
                src="./img/brasao-uninassau.png"
                alt="Brasão da UNINASSAU"
                class="logo"
            >
            <span class="nome-marca">UNINASSAU</span>
        </header>

        <section class="formulario cadastro">
            <h1>Crie sua conta!</h1>
            <p class="subtitulo">
                Preencha os dados abaixo para se cadastrar
                na plataforma da UNINASSAU.
            </p>

            <form action="#" method="post">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        autocomplete="bday"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone (com DDD)</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button type="submit" class="botao">
                    Cadastrar
                </button>
            </form>

            <p class="texto-auxiliar registro-link">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>
</body>
</html>
