
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UNINASSAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <img
                src="img/brasao-uninassau.png"
                alt="Brasão da UNINASSAU"
                class="logo"
            >
            <span class="nome-marca">UNINASSAU</span>
        </header>

        <section class="formulario login">
            <h1>Bem-vindo(a)!</h1>
            <p class="subtitulo">
                Faça login para acessar sua conta.
            </p>

            <form action="#" method="post">
                <div class="campo">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p class="texto-auxiliar recuperar">
                    Esqueceu sua senha?
                    <a href="recuperar-senha.html">
                        Recuperar Senha
                    </a>
                </p>

                <button type="submit" class="botao">
                    Entrar
                </button>
            </form>

            <p class="texto-auxiliar registro-link">
                Não tem uma conta?
                <a href="cadastro.html">Registre-Se</a>
            </p>
        </section>
    </main>
</body>
</html>
